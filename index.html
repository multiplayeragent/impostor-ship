<style>

  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body { font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; }

  #msg small { display: block; font-size: clamp(14px, 2.6vw, 20px); font-weight: 600; color: #dfe5ff; letter-spacing: 0; margin-top: 8px; }
  .red { color: var(--red); } .blue { color: var(--blue); } .gold { color: var(--gold); }
  #hint { left: 0; right: 0; bottom: max(40px, calc(env(safe-area-inset-bottom) + 30px)); text-align: center; font-size: 14px; color: #dfe5ff; padding: 0 110px 0 16px; }
  #keys { right: max(14px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 8px; font-size: 13px; font-weight: 700; }

  .btns { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: 74px 74px; gap: 10px; }
  .btns button { width: 74px; height: 74px; border-radius: 50%; border: 2px solid #ffffff50; background: #ffffff16; color: #fff; font: 800 12px system-ui, sans-serif; touch-action: none; opacity: .4; }
  .btns button.on { opacity: 1; background: #ffffff30; }
  #use { grid-column: 2; grid-row: 2; width: 84px; height: 84px; }
  #kill.on { background: #ff4d5e70; border-color: #ff98a2; } #report.on { background: #ffd16660; }
  #lobby { position: fixed; left: 50%; transform: translateX(-50%); top: max(64px, calc(env(safe-area-inset-top) + 54px)); font-size: 14px; color: var(--dim); }
  #lobby input { margin-left: 8px; width: 150px; height: 40px; border-radius: 10px; border: 1px solid #ffffff33; background: #ffffff14; color: #fff; padding: 0 10px; font: inherit; font-size: 16px; }
  .over { position: fixed; inset: 0; display: grid; place-items: center; background: #04060ed6; padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); box-sizing: border-box; }
  .card { width: min(720px, calc(100vw - 32px)); max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid #ffffff22; box-shadow: 0 20px 60px #0008; }
  .card header { display: flex; align-items: baseline; gap: 10px; }
  .card h2 { margin: 0; font-size: 20px; }
  #mTime { margin-left: auto; color: var(--gold); font-weight: 800; white-space: nowrap; }
  #votes { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; }
  #votes button, #skip { min-height: 46px; display: flex; align-items: center; gap: 8px; border-radius: 12px; border: 2px solid transparent; background: #ffffff10; color: #fff; font: 700 14px system-ui, sans-serif; padding: 6px 10px; text-align: left; cursor: pointer; }
  #votes button:disabled, #skip:disabled { cursor: default; }
  #votes button.dead { opacity: .32; text-decoration: line-through; }
  #votes button.mine, #skip.mine { border-color: var(--gold); background: #ffd16626; }
  #votes .dot { width: 22px; height: 26px; border-radius: 11px 11px 7px 7px; flex: none; box-shadow: inset -4px -3px 0 #0003; }
  #votes .tag { margin-left: auto; font-size: 11px; color: var(--green); font-weight: 800; }
  #skip { justify-content: center; }

  #chat b { margin-right: 6px; } #chat .sys { color: var(--dim); font-style: italic; }

  #over .card { width: min(380px, 92vw); text-align: center; }
  #oTitle { font-size: 28px !important; } #oWhy, #oNext { color: var(--dim); } #oImp { font-weight: 700; }

  #board li span { float: right; }
</style>

<body>
<canvas id="game"></canvas>
<div class="hud" id="tasks" hidden><div class="lbl">SHIP TASKS</div><div id="bar"><i></i></div><div id="role"></div><div id="list"></div></div>

  <button class="go" id="again">Play again</button><div id="oNext"></div>
</div></div>
<script>
/* ═══ IMPOSTOR SHIP · a Multiplayer Agent starter ════════════════════════════════════════
 * Do your tasks. Find the impostor. Party, 4–10 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ every number worth tuning: timers, ranges, bots
 *   SHIP MAP ...... the map as rows of text, room names, task spots, the emergency button
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SEALED SECRETS  the Seal helper: a role is encrypted so only its owner can read it
 *   GAME (HOST) ... phases (lobby, play, meet, eject, over), dealing roles, kills, votes, wins
 *   BOTS (HOST) ... bots walk to tasks, report bodies, chat and vote; a bot impostor hunts
 *   ME ............ walking, tasks, kill, report, the button, opening my role
 *   DRAW .......... the ship, crewmates, bodies, the dark, the ejection
 *   SCREENS ....... HUD, meeting, results, leaderboard
 *   INPUT ......... keyboard, drag-to-move stick, touch buttons
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (packed position) ~12 times a second, `hb`
 *     (heartbeat) once a second, and `n` (name), `c` (color), `pk` (public key) once.
 *   - The HOST is the lowest sessionId among live players, worked out every frame. Only the
 *     host writes the shared fields: `game` (the whole game: phase, timers, roster, dead,
 *     bodies, meeting, votes, task bar, winner; `v` goes up on every write), `roles` (sealed
 *     roles), `bots` (bot positions) and `chat` (the recent meeting chat).
 *   - Roles are HIDDEN: the host seals each player's role to that player's key, so nobody
 *     else can read it (the host deals, so it knows). When the host changes, every player
 *     re-sends its own role sealed to the new host ("role"); an impostor role nobody claims
 *     goes to a living bot, so the game carries on.
 *   - Intents to the host: "act" (sealed, so a kill and a task look the same), "report",
 *     "button", "vote", "chat", "ready". The host checks each one and writes the result.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for every game your side wins.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 8,             // bots fill the crew up to this many players (4–10)
  maxPlayers: 10,       // more humans than this watch until the next game
  impostors: 1,         // impostors per game
  tasksEach: 4,         // tasks per crewmate
  taskMs: 1800,         // hold Use this long to finish a task
  speed: 200,           // walking speed, px per second
  vision: 270,          // how far a crewmate sees in the dark, px
  impVision: 360,       // the impostor sees further
  useRange: 64,         // reach for tasks and the emergency button, px
  killRange: 80,        // reach for a kill, px
  reportRange: 120,     // reach for reporting a body, px
  killCooldown: 18000,  // ms between kills; it also restarts when play starts and after each meeting
  introMs: 3500,        // the role splash at the start; nobody moves yet
  lobbyMs: 6000,        // countdown before a game
  talkMs: 12000,        // a meeting: talk this long before voting opens…
  voteMs: 25000,        // …then this long to vote (it ends early once everyone has voted)
  ejectMs: 5500,        // the ejection screen
  overMs: 14000,        // the results screen
  buttonDelay: 12000,   // the emergency button wakes up this long after play (re)starts
  emergencies: 1,       // button presses per player per game
  chatLines: 8,         // meeting chat lines kept in state
  chatMax: 70,          // characters per chat line
  botKillChance: 0.3,   // per second, while a bot impostor is ready with a crewmate in reach
  botReportMs: [600, 1800], // how long a bot takes to report a body it walks past
  board: "wins",        // leaderboard: games won
};
const BOT_NAMES = ["Nova", "Sprocket", "Juno", "Rusty", "Pixel", "Comet", "Mochi", "Orbit", "Ziggy", "Bolt"];
// [name, hue, saturation %, lightness %]
const COLORS = [["Red", 355, 78, 52], ["Blue", 222, 80, 58], ["Green", 140, 62, 42], ["Pink", 322, 80, 68], ["Orange", 28, 95, 55],
  ["Yellow", 50, 95, 58], ["Cyan", 184, 78, 50], ["Purple", 272, 68, 62], ["Lime", 92, 70, 50], ["White", 220, 18, 88]];
const hsl = (ci, dl = 0) => { const c = COLORS[ci] || COLORS[0]; return `hsl(${c[1]},${c[2]}%,${c[3] + dl}%)`; };

// ── SHIP MAP ────────────────────────────────────────────────────────────────────────
const TILE = 48;
// One character per tile: a letter is a room's floor (see ROOMS), "." a hallway, " " space.
const MAP = [
  "                              ",
  " EEEEEE    CCCCCCCC    NNNNNN ",
  " EEEEEE    CCCCCCCC    NNNNNN ",
  " EEEEEE....CCCCCCCC....NNNNNN ",
  " EEEEEE....CCCCCCCC....NNNNNN ",
  " EEEEEE    CCCCCCCC    NNNNNN ",
  "   ..      CCCCCCCC      ..   ",
  "   ..         ..         ..   ",
  " MMMMMM       ..       SSSSSS ",
  " MMMMMM.....AAAAAA.....SSSSSS ",
  " MMMMMM.....AAAAAA.....SSSSSS ",
  " MMMMMM     AAAAAA     SSSSSS ",
  "   ..       AAAAAA       ..   ",
  " LLLLLL       ..       OOOOOO ",
  " LLLLLL    TTTTTTTT    OOOOOO ",
  " LLLLLL....TTTTTTTT....OOOOOO ",
  " LLLLLL....TTTTTTTT....OOOOOO ",
  " LLLLLL    TTTTTTTT    OOOOOO ",
  "                              ",
];
const ROOMS = { E: ["Engine", 215], C: ["Cafeteria", 200], N: ["Navigation", 185], M: ["Medbay", 160], A: ["Admin", 40],
  S: ["Shields", 255], L: ["Electrical", 48], T: ["Storage", 25], O: ["Comms", 290], ".": ["Hallway", 220] };
// Task spots, in tiles. Each crewmate gets CONFIG.tasksEach of them (the impostor gets fake ones).
const TASKS = [
  { n: "Fuel the engine", x: 2, y: 1 }, { n: "Align the engine", x: 5, y: 5 }, { n: "Empty the trash", x: 17, y: 1 },
  { n: "Chart a course", x: 27, y: 2 }, { n: "Steer the ship", x: 24, y: 5 }, { n: "Scan your body", x: 2, y: 10 },
  { n: "Swipe your card", x: 16, y: 12 }, { n: "Prime the shields", x: 27, y: 9 }, { n: "Fix the wiring", x: 1, y: 14 },
  { n: "Divert power", x: 5, y: 17 }, { n: "Stack the crates", x: 12, y: 17 }, { n: "Download data", x: 27, y: 16 },
];
for (const t of TASKS) { t.wx = (t.x + 0.5) * TILE; t.wy = (t.y + 0.5) * TILE; }
const BUTTON = { x: 15 * TILE, y: 4 * TILE }; // the emergency button, on the cafeteria table
const MAP_W = MAP[0].length * TILE, MAP_H = MAP.length * TILE, BODY_R = 13;
const tileAt = (x, y) => (MAP[Math.floor(y / TILE)] || "")[Math.floor(x / TILE)] || " ";
const floorAt = (x, y) => tileAt(x, y) !== " ";
const canStand = (x, y) => floorAt(x - BODY_R, y - BODY_R) && floorAt(x + BODY_R, y - BODY_R) && floorAt(x - BODY_R, y + BODY_R) && floorAt(x + BODY_R, y + BODY_R);
const roomAt = (x, y) => (ROOMS[tileAt(x, y)] || ROOMS["."])[0];

/** A walkable route from a to b (world px): tile steps, then shortcuts where the way is clear. */
function findPath(a, b) {
  const cols = MAP[0].length, key = (c, r) => r * cols + c;
  const start = key(Math.floor(a.x / TILE), Math.floor(a.y / TILE)), goal = key(Math.floor(b.x / TILE), Math.floor(b.y / TILE));
  const prev = new Map([[start, -1]]), queue = [start];
  while (queue.length && !prev.has(goal)) {
    const k = queue.shift(), c = k % cols, r = Math.floor(k / cols);
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const n = key(c + dc, r + dr);
      if ((MAP[r + dr] || "")[c + dc] > " " && !prev.has(n)) { prev.set(n, k); queue.push(n); }
    }
  }
  if (!prev.has(goal)) return [];
  const pts = [];
  for (let k = goal; k !== -1; k = prev.get(k)) pts.unshift({ x: (k % cols + 0.5) * TILE, y: (Math.floor(k / cols) + 0.5) * TILE });
  pts[pts.length - 1] = { x: b.x, y: b.y };
  const clear = (p, q) => { const n = Math.ceil(Math.hypot(q.x - p.x, q.y - p.y) / 12); for (let i = 1; i < n; i++) if (!canStand(p.x + (q.x - p.x) * i / n, p.y + (q.y - p.y) * i / n)) return false; return true; };
  const out = []; let from = a, i = 0;
  while (i < pts.length) { let j = pts.length - 1; while (j > i && !clear(from, pts[j])) j--; out.push(pts[j]); from = pts[j]; i = j + 1; }
  return out;
}
function randomFloor() {
  for (;;) { const r = 1 + Math.floor(Math.random() * (MAP.length - 2)), c = 1 + Math.floor(Math.random() * (MAP[0].length - 2)); if (/[A-Z]/.test(MAP[r][c])) return { x: (c + 0.5) * TILE, y: (r + 0.5) * TILE }; }
}

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'impostor-ship',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fb, map = (v) => v) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = map(parse(raw, fb));
  memo.set(key, { raw, v });
  return v;
}
/** A JSON field on a player's entity, parsed once per change. */
function ent(id, field, fb) {
  const raw = S.entities.players?.[id]?.[field], k = id + "." + field, m = memo.get(k);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fb);
  memo.set(k, { raw, v });
  return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));
const nameOf = (id) => (id === net.sessionId ? myName : String(S.entities.players?.[id]?.n ?? "Player")).slice(0, 14);
const colorOf = (id) => (id === net.sessionId ? myColor : Number(S.entities.players?.[id]?.c ?? 0));
const pkOf = (id) => (id === net.sessionId ? Seal.pub : S.entities.players?.[id]?.pk);

// ── SEALED SECRETS ──────────────────────────────────────────────────────────────────
// Hidden info in a relay room. Everything in room state reaches every client, so a secret
// (your role) is written SEALED: encrypted so only its one reader can open it. Each player
// publishes a public key in its own entity (`pk`); the host seals each role to that key and
// writes the boxes into the shared `roles` field.
//   - The host deals, so the host can read every role. Fine for friends, not cheat-proof.
//   - A new host can't open boxes the old host sealed, so on a host change every player
//     re-sends its own role to the new host (sealed, with mp.send).
//   - crypto.subtle needs https or localhost. Without it seal()/open() pass the value through.
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const Seal = {
  pair: null,
  pub: "",
  keys: new Map(), // other player's public key -> derived AES key
  get on() { return !!(window.crypto && crypto.subtle); },
  /** Make this player's key pair. Returns the public key to publish: me.set("pk", pub). */
  async init() {
    if (!this.on) return "";
    this.pair = await crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, false, ["deriveKey"]);
    this.pub = b64(await crypto.subtle.exportKey("raw", this.pair.publicKey));
    return this.pub;
  },
  async key(otherPub) {
    let k = this.keys.get(otherPub);
    if (!k) {
      const theirs = await crypto.subtle.importKey("raw", unb64(otherPub), { name: "ECDH", namedCurve: "P-256" }, false, []);
      k = await crypto.subtle.deriveKey({ name: "ECDH", public: theirs }, this.pair.privateKey, { name: "AES-GCM", length: 128 }, false, ["encrypt", "decrypt"]);
      this.keys.set(otherPub, k);
    }
    return k;
  },
  /** Seal any JSON value so only the holder of `toPub` (and you) can open it. */
  async seal(toPub, value) {
    if (!this.on) return "p:" + JSON.stringify(value);
    if (!toPub || !this.pair) return ""; // never plaintext online: nobody can open an empty box
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await this.key(toPub), new TextEncoder().encode(JSON.stringify(value)));
    return b64(iv) + "." + b64(ct);
  },
  /** Open a box sealed by the player whose public key is `fromPub`. Null if it isn't for you. */
  async open(fromPub, box) {
    if (typeof box !== "string") return null;
    if (box.startsWith("p:")) return JSON.parse(box.slice(2));

  }
  seenFx.bodies = g.bodies.length;
  if (g.ph === "meet" && seenFx.mn !== g.mn) { tone(520, 160, "square"); setTimeout(() => tone(520, 160, "square"), 240); }
  seenFx.mn = g.mn;
  const deadNow = g.ph !== "lobby" && inGame(g, net.sessionId) && g.dead.includes(net.sessionId);
  if (deadNow && !seenFx.dead && g.ph === "play") me.diedAt = Date.now();
  seenFx.dead = deadNow;
  if (g.ph === "over" && seenFx.ph !== "over") tone(iAmImp(g) === (g.win === "imp") ? 660 : 220, 500, "triangle", 0.07);
  seenFx.ph = g.ph;
}

function banner(g) {
  const t = Date.now(), secs = (ms) => Math.max(0, Math.ceil(ms / 1000));
  if (g.ph === "lobby") return ATTRACT ? "" : `Launching in ${secs(g.endsAt - t)}<small>Bots fill the empty seats. Up to ${CONFIG.maxPlayers} can play.</small>`;
  if (g.ph === "play") {
    if (!inGame(g, net.sessionId)) return ATTRACT || t > g.at + 6000 ? "" : `Game in progress<small>You'll join the next one. Watch as a ghost.</small>`;
    if (t < g.at + CONFIG.introMs && g.mn === 0) return !myRole || myRole.g !== g.id ? "Shhh…<small>Dealing roles</small>"
      : myRole.r === "imp" ? `<span class="red">IMPOSTOR</span><small>Kill the crew. Don't get caught.</small>` : `<span class="blue">CREWMATE</span><small>There is ${g.impLeft} impostor among us. Do your tasks.</small>`;
    if (me.diedAt && t - me.diedAt < 3500) return `<span class="red">You were killed</span><small>Finish your tasks as a ghost.</small>`;
    return "";
  }
  if (g.ph === "meet" && t < g.mt.votesAt - CONFIG.talkMs + 1300) return g.mt.why === "body" ? `<span class="red">DEAD BODY REPORTED</span>` : `<span class="red">EMERGENCY MEETING</span>`;
  if (g.ph === "eject") {
    const e = g.ej, n = esc(nameIn(g, e.i)), late = t > g.endsAt - CONFIG.ejectMs * 0.6, left = `${g.impLeft} impostor${g.impLeft === 1 ? "" : "s"} remain${g.impLeft === 1 ? "s" : ""}.`;
    if (!e.i) return `No one was ejected.<small>${e.tie ? "It was a tie." : "The crew skipped."} ${late ? left : ""}</small>`;
    return `${n} was ejected.<small>${late ? `${n} was ${e.imp ? "" : "not "}The Impostor. ${left}` : "&nbsp;"}</small>`;
  }
  return "";
}

let meetSig = "", chatRaw = "", overFor = -1, myVote = "";
let dropped = false; // true while the connection is down: the HUD keeps showing "Reconnecting…"
function hud(g) {
  const n = humans().length;
  $("net").textContent = ATTRACT ? "" : net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the ship" : ""}`;
  if (!g) return;
  if (g.ph === "lobby") fixColor();
  const t = Date.now(), mine = inGame(g, net.sessionId), amAlive = alive(g, net.sessionId), imp = iAmImp(g), m = $("msg"), html = banner(g);
  if (m.innerHTML !== html) m.innerHTML = html;
  $("tasks").hidden = ATTRACT || g.ph === "lobby" || g.ph === "over";
  $("bar").firstElementChild.style.width = (g.tt ? (100 * g.td) / g.tt : 0) + "%";
  const wait = Math.ceil(myKillWait(g) / 1000);
  $("role").innerHTML = !mine ? "WATCHING · next game soon" : !amAlive ? "GHOST · finish your tasks" : imp ? `<span class="red">IMPOSTOR</span> · ${wait > 0 ? "kill in " + wait + "s" : "kill ready"}` : `<span class="blue">CREWMATE</span>`;
  $("list").innerHTML = !mine || (!amAlive && imp) ? "" : (imp ? "<div>Fake tasks, to blend in:</div>" : "") +
    tasksFor(g, net.sessionId).map((s) => `<div class="${me.done.has(s) ? "done" : ""}">${me.done.has(s) ? "✓" : "•"} ${TASKS[s].n} <span style="opacity:.6">(${roomAt(TASKS[s].wx, TASKS[s].wy)})</span></div>`).join("");
  $("room").textContent = ATTRACT || g.ph !== "play" ? "" : roomAt(me.x, me.y);
  const hintOn = !ATTRACT && (g.ph === "lobby" || (g.ph === "play" && g.mn === 0 && t < g.at + 15000));
  $("hint").textContent = !hintOn ? "" : touchUI ? "Drag anywhere to walk · hold USE at a yellow ! · REPORT a body you find" : "WASD or arrows to walk · hold E at a yellow ! · R to report a body · E at the red button calls a meeting";
  const canUse = g.ph === "play" && mine && (me.near != null || (amAlive && buttonReady(g) && dist(me, BUTTON) < CONFIG.useRange + 10));
  const canKill = !!killTarget(g) && wait <= 0, canReport = !!bodyNear(g);
  $("btns").hidden = !touchUI || ATTRACT || g.ph !== "play" || !mine;
  $("keys").hidden = touchUI || ATTRACT || g.ph !== "play" || !mine;
  $("use").classList.toggle("on", canUse); $("kUse").classList.toggle("on", canUse);
  $("report").classList.toggle("on", canReport); $("kReport").classList.toggle("on", canReport);
  $("kill").hidden = $("kKill").hidden = !imp || !amAlive;
  $("kill").classList.toggle("on", canKill); $("kKill").classList.toggle("on", canKill);
  $("kill").textContent = wait > 0 ? `KILL ${wait}` : "KILL"; $("kKill").textContent = wait > 0 ? `Q · Kill ${wait}s` : "Q · Kill";
  $("lobby").hidden = ATTRACT || g.ph !== "lobby";
  renderMeeting(g);
  renderOver(g);
}

function renderMeeting(g) {
  const t = Date.now(), show = g.ph === "meet" && t >= g.mt.votesAt - CONFIG.talkMs + 1300;
  $("meet").hidden = !show;
  if (!show) { myVote = ""; return; }
  const mt = g.mt, open = t >= mt.votesAt, amAlive = alive(g, net.sessionId), voted = mt.votes[net.sessionId] || myVote;
  $("mTitle").textContent = mt.why === "body" ? `${nameIn(g, mt.by)} found ${nameIn(g, mt.body)}'s body` : `${nameIn(g, mt.by)} called a meeting`;
  $("mTime").textContent = open ? `Vote · ${Math.max(0, Math.ceil((g.endsAt - t) / 1000))}s` : `Voting in ${Math.ceil((mt.votesAt - t) / 1000)}s`;
  const sig = JSON.stringify([g.mn, g.dead, Object.keys(mt.votes), open, voted, amAlive]);
  if (sig !== meetSig) {
    meetSig = sig;
    const canVote = open && amAlive && !voted;
    $("votes").innerHTML = g.ros.map((r) => `<button data-id="${esc(r.i)}" class="${g.dead.includes(r.i) ? "dead" : ""} ${voted === r.i ? "mine" : ""}" ${canVote && !g.dead.includes(r.i) ? "" : "disabled"}>
      <span class="dot" style="background:${hsl(r.c)}"></span>${esc(r.n)}${r.i === net.sessionId ? " (you)" : ""}${mt.votes[r.i] ? '<span class="tag">VOTED</span>' : ""}</button>`).join("");
    $("skip").disabled = !canVote; $("skip").classList.toggle("mine", voted === "skip");
    $("skip").textContent = ATTRACT ? "Skip vote" : !amAlive ? "Ghosts can't vote" : voted ? "Vote cast" : open ? "Skip vote" : "Talk it out first…";
    $("say").hidden = ATTRACT;
    $("sayText").disabled = !amAlive; $("sayText").placeholder = amAlive ? "Say something…" : "Ghosts can't talk";
  }
  const raw = S.shared.chat;
  if (raw !== chatRaw) {
    chatRaw = raw;
    const c = shared("chat", { m: 0, l: [] });
    $("chat").innerHTML = (c.m === g.mn && c.l.length ? c.l : [["", "Who do you think it is?"]]).map(([id, text]) => id ? `<div><b style="color:${hsl(rosOf(g, id)?.c ?? 0, 10)}">${esc(nameIn(g, id))}</b>${esc(text)}</div>` : `<div class="sys">${esc(text)}</div>`).join("");
    $("chat").scrollTop = 1e6;
  }
}
function castVote(target) {
  const g = game();
  if (!g || g.ph !== "meet" || !alive(g, net.sessionId) || g.mt.votes[net.sessionId] || myVote || Date.now() < g.mt.votesAt) return;
  myVote = target; meetSig = "";
  toHost("vote", { t: target });
  tone(440, 90);
}
$("votes").addEventListener("click", (e) => { const b = e.target.closest("button[data-id]"); if (b && !b.disabled) castVote(b.dataset.id); });
$("skip").addEventListener("click", () => castVote("skip"));
$("say").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("sayText").value.trim();
  if (text) toHost("chat", { t: text });
  $("sayText").value = "";
});

function renderOver(g) {
  $("over").hidden = g.ph !== "over";
  if (g.ph !== "over") return;
  $("oTitle").innerHTML = g.win === "crew" ? '<span class="blue">Crew wins!</span>' : '<span class="red">Impostor wins!</span>';
  $("oWhy").textContent = { tasks: "Every task got done.", caught: "The impostor was voted out.", kills: "The impostor took out the crew." }[g.why] || "";
  $("oImp").innerHTML = g.imps.length ? `The impostor was ${g.imps.map((i) => dot(rosOf(g, i)?.c ?? 0) + esc(nameIn(g, i))).join(", ")}` : "";
  $("oNext").textContent = `Next game in ${Math.max(0, Math.ceil((g.endsAt - Date.now()) / 1000))}s`;
  $("again").textContent = g.ready.includes(net.sessionId) ? "Ready ✓" : "Play again";
  if (overFor !== g.id) { overFor = g.id; showBoard(g); }
}
let board = null;
function showBoard(g) {
  const list = $("board"), mine = inGame(g, net.sessionId), won = mine && myRole?.g === g.id && (myRole.r === "imp") === (g.win === "imp");
  $("oYou").textContent = !mine || ATTRACT ? "" : won ? "You won! +1 on the board." : "Your side lost this one.";
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading the leaderboard…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} win${e.score === 1 ? "" : "s"}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
$("again").addEventListener("click", () => toHost("ready", { r: 1 }));
$("name").addEventListener("change", () => {
  myName = $("name").value.trim().slice(0, 14) || myName;
  try { localStorage.setItem("mpa-name", myName); } catch {}
  net && net.me.set("n", myName);
});

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches;
const keys = new Set();
let useBtn = false;
const useHeld = () => useBtn || keys.has("e") || keys.has(" ");
const stick = { on: false, id: 0, x0: 0, y0: 0, dx: 0, dy: 0 };
function moveInput() {
  let x = 0, y = 0;
  if (keys.has("a") || keys.has("arrowleft")) x--;
  if (keys.has("d") || keys.has("arrowright")) x++;
  if (keys.has("w") || keys.has("arrowup")) y--;
  if (keys.has("s") || keys.has("arrowdown")) y++;
  if (stick.on) { x = stick.dx; y = stick.dy; }
  const l = Math.hypot(x, y);
  return l > 1 ? [x / l, y / l] : [x, y];
}
addEventListener("keydown", (e) => {
  if (e.target instanceof HTMLInputElement) return; // typing a name or a chat line
  unlockAudio();
  const k = e.key.toLowerCase();
  if (!keys.has(k)) { if (k === "e" || k === " ") pressUse(); if (k === "q") tryMyKill(); if (k === "r") tryReport(); }
  keys.add(k);
  if (k === " " || k.startsWith("arrow")) e.preventDefault();
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault(); unlockAudio();
  Object.assign(stick, { on: true, id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 });
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", (e) => {
  if (!stick.on || e.pointerId !== stick.id) return;
  const dx = e.clientX - stick.x0, dy = e.clientY - stick.y0, l = Math.hypot(dx, dy);
  const k = l < 8 ? 0 : Math.min(1, l / 50) / l;
  stick.dx = dx * k; stick.dy = dy * k;
});
for (const ev of ["pointerup", "pointercancel"]) cv.addEventListener(ev, (e) => { if (e.pointerId === stick.id) Object.assign(stick, { on: false, dx: 0, dy: 0 }); });
$("use").addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); useBtn = true; pressUse(); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) $("use").addEventListener(ev, () => { useBtn = false; });
$("kill").addEventListener("pointerdown", (e) => { e.preventDefault(); tryMyKill(); });
$("report").addEventListener("pointerdown", (e) => { e.preventDefault(); tryReport(); });
document.addEventListener("touchmove", (e) => { if (!e.target.closest("#chat")) e.preventDefault(); }, { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); }
  watchHost();
  if (isHost()) hostTick(dt); else host.was = false;
  const g = game();
  if (g) { myTick(g, dt); effects(g); }
  updateActors(g, dt);
  draw(g, now);
  if (now - lastHud > 120) { lastHud = now; hud(g); }
  requestAnimationFrame(frame);
}

(async function start() {
  if (ATTRACT) Object.assign(CONFIG, { seats: 8, lobbyMs: 200, introMs: 300, killCooldown: 2000, killRange: 100, reportRange: 400, talkMs: 2000, voteMs: 2800, ejectMs: 3000, overMs: 4000, botReportMs: [200, 500], botKillChance: 4 });
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  for (const [type, fn] of Object.entries(HANDLERS)) net.on(type, (msg, from) => { if (isHost() && msg) fn(from, msg); });
  net.on("act", async (msg, from) => { // sealed to the host: only the host can open it
    if (!msg || msg.to !== net.sessionId || !isHost()) return;
    const d = await Seal.open(pkOf(from), msg.box);
    if (d) onAct(from, d);
  });
  net.on("role", async (msg, from) => { // a player's own role, re-sent to a new host
    if (!msg || msg.to !== net.sessionId) return;
    const v = await Seal.open(pkOf(from), msg.box);
    if (!v) return;
    heard.set(from, v);
    if (isHost()) learnRole(from, v);
  });
  net.on("who", (msg, from) => resendRole(from));
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const pk = await Seal.init().catch(() => "");
  const taken = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => Number(p.c)));
  myColor = COLORS.findIndex((_, i) => !taken.has(i));
  if (myColor < 0) myColor = Math.floor(Math.random() * COLORS.length);
  $("name").value = myName;
  net.me.set({ n: myName, c: myColor, hb: Date.now(), pk });
  requestAnimationFrame(frame);
})();
</script>
